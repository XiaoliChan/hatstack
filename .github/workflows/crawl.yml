name: Crawl

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "crawl only first N events (0 = all)"
        default: "0"
      events:
        description: "space separated event keys, e.g. 'us-24 asia-21' (optional)"
        default: ""
      refresh:
        description: "ignore cache, full re-crawl"
        type: boolean
        default: false
      commit:
        description: "commit dataset back to main after crawl"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 3 * *" # monthly: 3rd of month, 06:00 UTC

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install beautifulsoup4 lxml requests pytest
          python -m pytest crawler/tests -q

  crawl:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt
          playwright install chromium --with-deps
      - name: Crawl
        run: |
          ARGS=""
          [ "$LIMIT" != "0" ] && ARGS="$ARGS --limit $LIMIT"
          [ -n "$EVENTS" ] && ARGS="$ARGS --events $EVENTS"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh"
          python -m crawler crawl --out dataset $ARGS
        env:
          LIMIT: ${{ inputs.limit || '0' }}
          EVENTS: ${{ inputs.events || '' }}
          REFRESH: ${{ inputs.refresh || github.event_name == 'schedule' }}
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: dataset/
      - name: Commit dataset
        if: ${{ inputs.commit == true || github.event_name == 'schedule' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataset/
          if git diff --cached --quiet; then echo "no dataset changes"; exit 0; fi
          git commit -m "chore(data): refresh dataset (${{ github.run_id }})"
          git push
