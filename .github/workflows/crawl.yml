name: Crawl

# Parallel matrix: a setup job computes the conference list, one job per
# conference crawls in parallel and uploads its cache; a single assemble job
# merges all caches into the dataset and commits once (single writer).

on:
  workflow_dispatch:
    inputs:
      confs:
        description: "space or comma separated conference ids (default: all)"
        default: ""
      events:
        description: "space separated event keys for batch dispatches (optional)"
        default: ""
      refresh:
        description: "ignore cache, full re-crawl"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 3 * *" # monthly: 3rd of month, 06:00 UTC

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          default = ["blackhat","defcon","ccc","offensivecon","usenix",
                     "x33fcon","redteamvillage","hitcon","kcon"]
          raw = os.environ.get("CONFS", "").replace(",", " ").split()
          confs = raw or default
          print("matrix=" + json.dumps({"conf": confs}))
          PY
        env:
          CONFS: ${{ inputs.confs || '' }}

  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    concurrency:
      # unique per dispatched run: batched blackhat dispatches (multiple runs
      # with disjoint --events sets) must run in parallel, not cancel each other
      group: crawl-${{ matrix.conf }}-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crawler/requirements.txt
          playwright install chromium --with-deps
      - name: Crawl ${{ matrix.conf }}
        run: |
          ARGS=""
          [ -n "$EVENTS" ] && ARGS="$ARGS --events $EVENTS"
          [ "$REFRESH" = "true" ] && ARGS="$ARGS --refresh"
          python -u -m crawler crawl --confs ${{ matrix.conf }} $ARGS --out /tmp/out
        env:
          EVENTS: ${{ inputs.events || '' }}
          REFRESH: ${{ inputs.refresh || github.event_name == 'schedule' }}
      - name: Upload cache artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ matrix.conf }}
          path: crawler/cache/${{ matrix.conf }}/
          retention-days: 3

  assemble:
    runs-on: ubuntu-latest
    needs: crawl
    if: always()
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml requests pytest
      - name: Run tests
        run: python -m pytest crawler/tests -q
      - name: Download all cache artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: cache-*
      - name: Merge caches and build dataset
        run: |
          mkdir -p crawler/cache
          for d in /tmp/artifacts/cache-*; do
            name="${d##*/cache-}"
            mkdir -p "crawler/cache/$name"
            cp -r "$d"/. "crawler/cache/$name/"
          done
          ls crawler/cache
      - name: Upload dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataset-raw
          path: crawler/cache/
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # pull FIRST, then build from the merged cache: the dataset is fully
          # derivable from cache, so rebasing a stale dataset commit is the
          # race that killed two batch assembles — build after pull instead
          git pull --rebase origin main
          python -u -m crawler crawl --use-cache --out dataset
          git add dataset/ crawler/cache/
          if git diff --cached --quiet; then echo "no dataset changes"; exit 0; fi
          git commit -m "chore(data): refresh dataset (${{ github.run_id }})"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            sleep $((i * 20))
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD   # drop half-rebuilt tree: pull refuses otherwise
            git clean -fd dataset crawler/cache 2>/dev/null || true
            git pull --rebase origin main
            python -u -m crawler crawl --use-cache --out dataset
            git add dataset/ crawler/cache/
            git commit -m "chore(data): refresh dataset (${{ github.run_id }}) (retry $i)"
          done
          exit 1
