name: Recon 2

# Second recon wave: community-tail archives (BSidesSF/ShmooCon/DerbyCon/
# recon.cx), nav discovery (troopers/codeblue), render dump for nullcon,
# and rate-limited retries (ekoparty/44con) + VB wayback recheck.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: bsidessf
            urls: "https://bsidessf.org/archives|https://bsidessf.org/previous|https://bsidessf.org/"
          - name: shmoocon
            urls: "https://shmoocon.org/past-talks/|https://shmoocon.org/talks|https://shmoocon.org/"
          - name: derbycon
            urls: "https://www.derbycon.com/talks/|https://www.derbycon.com/past|https://www.derbycon.com/"
          - name: reconnn
            urls: "https://recon.cx/2019/talks/|https://recon.cx/|https://recon.cx/2018/schedule/"
          - name: troopers-nav
            urls: "https://troopers.de/talks/|https://troopers.de/events/|https://troopers.de/archiv/"
          - name: codeblue-nav
            urls: "https://codeblue.jp/|https://codeblue.jp/2025/|https://codeblue.jp/2024/program/"
          - name: ekoparty2
            urls: "https://www.ekoparty.org/en/archive/|https://www.ekoparty.org/ekoparty-archive/|https://www.ekoparty.org/"
          - name: con44b
            urls: "https://www.44con.com/|https://www.44con.com/44con-2024/|https://www.44con.com/talks/"
          - name: vb-wayback
            urls: "https://web.archive.org/cdx/search/cdx?url=vbconference.com/presentations&matchType=prefix&output=json&limit=20&collapse=urlkey&filter=statuscode:200|https://web.archive.org/web/2020id_/https://www.virusbulletin.com/conference/presentations"
          - name: h2hc-wayback
            urls: "https://web.archive.org/cdx/search/cdx?url=h2hc.com.br&matchType=domain&output=json&limit=20&collapse=urlkey&filter=statuscode:200"
          - name: mosec-wayback
            urls: "https://web.archive.org/cdx/search/cdx?url=mosec.org&matchType=domain&output=json&limit=20&collapse=urlkey&filter=statuscode:200"
    steps:
      - name: Probe ${{ matrix.name }}
        run: |
          mkdir -p /tmp/recon
          IFS='|' read -ra URLS <<< "${{ matrix.urls }}"
          i=0
          for u in "${URLS[@]}"; do
            i=$((i+1))
            out="/tmp/recon/${{ matrix.name }}-$i.txt"
            : > "$out.body"
            code=$(curl -4 -sL --max-time 30 -A "Mozilla/5.0 (X11; Linux x86_64) Chrome/130.0.0.0" \
              -o "$out.body" -w "%{http_code}" "$u" || echo ERR)
            {
              echo "URL: $u"
              echo "CODE: $code"
              echo "SIZE: $(wc -c < "$out.body" 2>/dev/null)"
              echo "--- markers ---"
              grep -oiE '(\.pdf|\.mp4|schedule\.json|pretalx|frab|__NEXT_DATA__|api/|talk|speaker|slide)' "$out.body" 2>/dev/null | sort | uniq -c | sort -rn | head -10
              echo "--- first 1500 bytes ---"
              head -c 1500 "$out.body" 2>/dev/null
            } > "$out" || true
            rm -f "$out.body"
            sleep 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: recon2-${{ matrix.name }}
          path: /tmp/recon/
