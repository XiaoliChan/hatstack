name: CDX Discovery

# One-off probe: find what Wayback ACTUALLY has archived for the ancient
# blackhat path families, from a fresh CI IP (local box gets throttled).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Query CDX for ancient families
        run: |
          mkdir -p /tmp/out
          query() {
            fam="$1"
            echo "--- $fam ---"
            curl -4 -s --max-time 40 \
              "https://web.archive.org/cdx/search/cdx?url=$fam&matchType=prefix&output=json&limit=60&collapse=urlkey&filter=statuscode:200" \
              -o "/tmp/out/${fam//\//_}.json" || true
            sleep 4
          }
          query "blackhat.com/bh-usa"
          query "blackhat.com/bh-us-1"
          query "blackhat.com/bh-us-2"
          query "blackhat.com/bh-europa"
          query "blackhat.com/bh-eu-2"
          query "blackhat.com/bh-eu-1"
          query "blackhat.com/win-usa"
          query "blackhat.com/bh-asia"
          query "blackhat.com/bh-japan"
          # modern failures: exact pages wayback should have
          for k in asia-14 us-13 us-14 us-18 eu-18 us-20 asia-19 asia-20 asia-22 eu-23 asia-25 eu-26 us-26; do
            curl -4 -s --max-time 40 \
              "https://web.archive.org/cdx/search/cdx?url=blackhat.com/$k&matchType=prefix&output=json&limit=40&collapse=urlkey&filter=statuscode:200" \
              -o "/tmp/out/modern-$k.json" || true
            sleep 4
          done
          ls -la /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: cdx-discovery
          path: /tmp/out/
