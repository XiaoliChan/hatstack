name: Egress Probe

# Phase 0, iteration 5 — XHR instead of fetch.
# v3/v4: window.fetch is unusable in-page (Transcend hijack + deeper blocks).
# v2 proof: the page's OWN XHR fetched sessions.json 200/574KB.
# Test A: plain XMLHttpRequest from the cleared page to every target path.
# Test B (fallback if A dies): second microsite navigation + capture its own XHR.

on:
  workflow_dispatch:

jobs:
  xhr-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: XHR probe
        run: |
          python - <<'PY'
          import json, time
          from playwright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          BASE = "https://www.blackhat.com"

          XHR_JS = """(u) => new Promise((resolve, reject) => {
              try {
                  const x = new XMLHttpRequest();
                  x.open('GET', u);
                  x.withCredentials = true;
                  x.timeout = 30000;
                  x.onload = () => resolve({status: x.status, len: x.responseText.length, head: x.responseText.slice(0, 120)});
                  x.onerror = () => reject(new Error('XHR network error'));
                  x.ontimeout = () => reject(new Error('XHR timeout'));
                  x.send();
              } catch (e) { reject(e); }
          })"""

          XHR_FULL = """(u) => new Promise((resolve, reject) => {
              const x = new XMLHttpRequest();
              x.open('GET', u);
              x.withCredentials = true;
              x.timeout = 30000;
              x.onload = () => resolve(x.responseText);
              x.onerror = () => reject(new Error('err'));
              x.send();
          })"""

          def clear_until_ready(page, url, max_tries=4):
              for i in range(max_tries):
                  try:
                      page.goto(url, timeout=60000, wait_until="domcontentloaded")
                  except Exception as e:
                      print("  goto error:", repr(e)[:150])
                  time.sleep(8)
                  t = page.title()
                  print(f"  try {i}: title={t[:60]!r}")
                  low = t.lower()
                  if "moment" not in low and "attention" not in low:
                      return True
                  time.sleep(12)
              return False

          def xhr(page, label, url, pause=12):
              print("-" * 60)
              print(f"XHR [{label}]: {url}")
              try:
                  res = page.evaluate(XHR_JS, url)
                  print(f"  STATUS {res['status']} | len {res['len']}")
                  print(f"  HEAD {res['head'][:110]!r}")
                  return res
              except Exception as e:
                  print("  XHR ERROR:", repr(e)[:200])
                  return {"status": -1, "len": 0, "head": ""}
              finally:
                  time.sleep(pause)

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox"])
              ctx = browser.new_context(user_agent=UA)
              page = ctx.new_page()

              print("=" * 60)
              print("TEST A: clear on us-24, then XHR everything")
              ok = clear_until_ready(page, BASE + "/us-24/briefings/schedule/index.html")
              print("CLEARED:", ok)
              if ok:
                  time.sleep(15)
                  targets = [
                      ("sessions us-24 control",  "/us-24/briefings/schedule/sessions.json"),
                      ("sessions usa/2025",       "/archive/usa/2025/briefings/schedule/sessions.json"),
                      ("sessions asia/2024",      "/archive/asia/2024/briefings/schedule/sessions.json"),
                      ("sessions europe/2023",    "/archive/europe/2023/briefings/schedule/sessions.json"),
                      ("sessions us-26 upcoming", "/us-26/briefings/schedule/sessions.json"),
                      ("legacy static us-16",     "/us-16/briefings.html"),
                      ("archives inventory",      "/html/archives.html"),
                  ]
                  results = {}
                  for label, path in targets:
                      results[label] = xhr(page, label, BASE + path)

                  print("=" * 60)
                  print("ITEM COUNTS for 200-OK sessions.json:")
                  for label, path in targets:
                      if "sessions" not in path:
                          continue
                      r = results.get(label, {})
                      if r.get("status") == 200 and r.get("len", 0) > 1000:
                          try:
                              txt = page.evaluate(XHR_FULL, BASE + path)
                              data = json.loads(txt)
                              n = len(data) if isinstance(data, list) else len(data.get("sessions", data))
                              print(f"  {label}: JSON_OK items={n}")
                          except Exception as e:
                              print(f"  {label}: parse error {repr(e)[:120]}")
                          time.sleep(8)

              print("=" * 60)
              print("TEST B: second microsite nav + capture its own XHR (eu-24)")
              captured = []
              def on_response(resp):
                  try:
                      if "sessions.json" in resp.url:
                          captured.append(resp)
                  except Exception:
                      pass
              page.on("response", on_response)
              ok2 = clear_until_ready(page, BASE + "/eu-24/briefings/schedule/index.html")
              print("TEST_B_CLEARED:", ok2)
              if ok2:
                  time.sleep(10)
                  li = page.locator("ul#cal_content_Day li").count()
                  print("TEST_B_RENDERED_LI:", li)
                  print("TEST_B_CAPTURED:", len(captured))
                  for r in captured:
                      try:
                          b = r.body()
                          print(f"  CAPTURED {r.url[-70:]} status={r.status} bytes={len(b)}")
                          try:
                              d = json.loads(b)
                              print("  CAPTURED_JSON_OK items:", len(d) if isinstance(d, list) else -1)
                          except Exception:
                              print("  CAPTURED_JSON: not json")
                      except Exception as e:
                          print("  capture read err:", repr(e)[:120])

              browser.close()
          PY
