name: Egress Probe

# Phase 0, iteration 4 — un-hijacked in-page fetch.
# v3 finding: Transcend's airgap.js monkey-patches window.fetch, so page.evaluate
# fetch() dies client-side. Fix under test: add_init_script stashes the pristine
# fetch at document-start (before any page script runs), then we call
# window.__origFetch for every target from the cleared page context.

on:
  workflow_dispatch:

jobs:
  origfetch-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Stashed-fetch probe
        run: |
          python - <<'PY'
          import json, time
          from playwright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          BASE = "https://www.blackhat.com"

          INIT = """
          Object.defineProperty(window, '__origFetch', {
            value: window.fetch.bind(window),
            writable: false,
            enumerable: false
          });
          """

          FETCH_JS = """async (u) => {
              const f = window.__origFetch;
              if (!f) { return {status: -2, len: 0, head: 'NO_ORIG_FETCH'}; }
              const r = await f(u, {credentials: 'include'});
              const t = await r.text();
              return {status: r.status, len: t.length, head: t.slice(0, 120)};
          }"""

          FETCH_FULL = """async (u) => {
              const f = window.__origFetch;
              const r = await f(u, {credentials: 'include'});
              return await r.text();
          }"""

          def clear_until_ready(page, url, max_tries=4):
              for i in range(max_tries):
                  try:
                      page.goto(url, timeout=60000, wait_until="domcontentloaded")
                  except Exception as e:
                      print("  goto error:", repr(e)[:150])
                  time.sleep(8)
                  t = page.title()
                  print(f"  try {i}: title={t[:60]!r}")
                  low = t.lower()
                  if "moment" not in low and "attention" not in low:
                      return True
                  time.sleep(12)
              return False

          def ofetch(page, label, url, pause=12):
              print("-" * 60)
              print(f"FETCH [{label}]: {url}")
              try:
                  res = page.evaluate(FETCH_JS, url)
                  print(f"  STATUS {res['status']} | len {res['len']}")
                  print(f"  HEAD {res['head'][:110]!r}")
                  return res
              except Exception as e:
                  print("  EVALUATE ERROR:", repr(e)[:200])
                  return {"status": -1, "len": 0, "head": ""}
              finally:
                  time.sleep(pause)

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox"])
              ctx = browser.new_context(user_agent=UA)
              ctx.add_init_script(INIT)
              page = ctx.new_page()

              print("=" * 60)
              print("STEP 1: clear challenge on us-24 schedule page")
              ok = clear_until_ready(page, BASE + "/us-24/briefings/schedule/index.html")
              print("CLEARED:", ok)
              if not ok:
                  print("FATAL: could not clear challenge")
                  browser.close()
                  raise SystemExit(0)

              time.sleep(15)

              print("=" * 60)
              print("STEP 2: __origFetch everything (paced)")
              targets = [
                  ("sessions us-24 control",   "/us-24/briefings/schedule/sessions.json"),
                  ("sessions usa/2025",        "/archive/usa/2025/briefings/schedule/sessions.json"),
                  ("sessions asia/2024",       "/archive/asia/2024/briefings/schedule/sessions.json"),
                  ("sessions europe/2023",     "/archive/europe/2023/briefings/schedule/sessions.json"),
                  ("sessions us-26 upcoming",  "/us-26/briefings/schedule/sessions.json"),
                  ("legacy static us-16",      "/us-16/briefings.html"),
                  ("archives inventory",       "/html/archives.html"),
              ]
              results = {}
              for label, path in targets:
                  results[label] = ofetch(page, label, BASE + path)

              print("=" * 60)
              print("STEP 3: item counts where sessions.json returned 200")
              for label, path in targets:
                  if "sessions" not in path:
                      continue
                  r = results.get(label, {})
                  if r.get("status") == 200 and r.get("len", 0) > 1000:
                      try:
                          txt = page.evaluate(FETCH_FULL, BASE + path)
                          data = json.loads(txt)
                          n = len(data) if isinstance(data, list) else len(data.get("sessions", data))
                          first = ""
                          if isinstance(data, list) and data:
                              s = data[0]
                              first = str({k: s.get(k) for k in ("id", "title") if isinstance(s, dict)})[:160]
                          print(f"  {label}: JSON_OK items={n} first={first!r}")
                      except Exception as e:
                          print(f"  {label}: parse error {repr(e)[:150]}")
                      time.sleep(10)

              browser.close()
          PY
