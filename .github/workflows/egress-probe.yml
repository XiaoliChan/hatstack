name: Egress Probe

# Phase 0, iteration 2: can a rendered schedule page's OWN XHR fetch sessions.json?
# Strategy under test: browser opens schedule page -> capture JSON responses via
# response listener -> if captured, the crawler is "render-and-capture", no direct
# JSON navigation needed. Also tests cf_clearance cookie carry-over to other paths.

on:
  workflow_dispatch:

jobs:
  capture-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Render-and-capture probe
        run: |
          python - <<'PY'
          import json, time
          from playwright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

          SCHEDULES = [
              "https://www.blackhat.com/us-24/briefings/schedule/index.html",
              "https://www.blackhat.com/archive/usa/2025/briefings/schedule/index.html",
              "https://www.blackhat.com/archive/asia/2024/briefings/schedule/index.html",
          ]

          def try_page(page, url):
              print("=" * 60)
              print("PAGE:", url)
              captured = []
              def on_response(resp):
                  try:
                      ct = (resp.headers or {}).get("content-type", "")
                      if "sessions" in resp.url or "json" in ct:
                          captured.append(resp)
                  except Exception:
                      pass
              page.on("response", on_response)
              try:
                  resp = page.goto(url, timeout=60000, wait_until="domcontentloaded")
                  print("NAV_STATUS:", resp.status if resp else None)
                  time.sleep(10)  # let the page's own JS fetch sessions.json + render
                  title = page.title()
                  print("TITLE:", title[:80])
                  if "moment" in title.lower() or "attention" in title.lower():
                      print("CHALLENGE_PAGE: yes; waiting 5s and reloading once")
                      time.sleep(5)
                      page.reload(timeout=60000, wait_until="domcontentloaded")
                      time.sleep(10)
                      print("TITLE_AFTER_RELOAD:", page.title()[:80])
                  li = page.locator("ul#cal_content_Day li").count()
                  print("RENDERED_SESSION_LI:", li)
                  print("JSON_RESPONSES_CAPTURED:", len(captured))
                  for r in captured:
                      try:
                          body = r.body()
                          print("  JSON_URL:", r.url[-70:])
                          print("  JSON_STATUS:", r.status, "bytes:", len(body))
                          try:
                              data = json.loads(body)
                              n = len(data) if isinstance(data, list) else -1
                              print("  JSON_PARSES: yes, items:", n)
                          except Exception as e:
                              print("  JSON_PARSES: no -", str(e)[:80])
                      except Exception as e:
                          print("  JSON body read error:", repr(e)[:120])
              except Exception as e:
                  print("ERROR:", repr(e)[:300])
              finally:
                  try:
                      page.remove_listener("response", on_response)
                  except Exception:
                      pass

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox"])
              ctx = browser.new_context(user_agent=UA)
              page = ctx.new_page()

              for u in SCHEDULES:
                  try_page(page, u)

              print("=" * 60)
              print("COOKIES_NOW:", sorted(c["name"] for c in ctx.cookies()))

              print("=" * 60)
              print("DIRECT_JSON_WITH_CONTEXT_COOKIES:")
              try:
                  r = ctx.request.get("https://www.blackhat.com/us-24/briefings/schedule/sessions.json", timeout=30000)
                  b = r.body()
                  print("  STATUS:", r.status, "bytes:", len(b))
                  try:
                      data = json.loads(b)
                      print("  JSON_PARSES: yes, items:", len(data) if isinstance(data, list) else -1)
                  except Exception:
                      print("  JSON_PARSES: no (likely CF block page)")
              except Exception as e:
                  print("  ERROR:", repr(e)[:200])

              print("=" * 60)
              print("ARCHIVES_HTML_AFTER_COOKIES:")
              try:
                  resp = page.goto("https://www.blackhat.com/html/archives.html", timeout=60000, wait_until="domcontentloaded")
                  time.sleep(3)
                  print("  STATUS:", resp.status if resp else None, "TITLE:", page.title()[:60])
              except Exception as e:
                  print("  ERROR:", repr(e)[:200])

              browser.close()
          PY
