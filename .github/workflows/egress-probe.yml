name: Egress Probe

# Phase 0, iteration 3 — the decisive test.
# Hypothesis: pass Cloudflare's managed challenge ONCE on a schedule page, then
# pull ALL data via same-origin fetch() from inside the cleared page context
# (Chromium TLS stack + cf_clearance + polite pacing). If this works, the live
# crawler architecture is: 1 page load + N in-page fetches.

on:
  workflow_dispatch:

jobs:
  inpage-fetch-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Cleared-context in-page fetch probe
        run: |
          python - <<'PY'
          import json, time
          from playwright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          BASE = "https://www.blackhat.com"

          FETCH_JS = """async (u) => {
              const r = await fetch(u, {credentials: 'include'});
              const t = await r.text();
              return {status: r.status, len: t.length, head: t.slice(0, 120)};
          }"""

          def clear_until_ready(page, url, max_tries=4):
              for i in range(max_tries):
                  try:
                      page.goto(url, timeout=60000, wait_until="domcontentloaded")
                  except Exception as e:
                      print("  goto error:", repr(e)[:150])
                  time.sleep(8)
                  t = page.title()
                  print(f"  try {i}: title={t[:60]!r}")
                  low = t.lower()
                  if "moment" not in low and "attention" not in low:
                      return True
                  time.sleep(12)
              return False

          def page_fetch(page, label, url, pause=15):
              print("-" * 60)
              print(f"FETCH [{label}]: {url}")
              try:
                  res = page.evaluate(FETCH_JS, url)
                  print(f"  STATUS {res['status']} | len {res['len']}")
                  print(f"  HEAD {res['head'][:110]!r}")
                  return res
              except Exception as e:
                  print("  EVALUATE ERROR:", repr(e)[:200])
                  return {"status": -1, "len": 0, "head": ""}
              finally:
                  time.sleep(pause)

          with sync_playwright() as p:
              browser = p.chromium.launch(args=["--no-sandbox"])
              ctx = browser.new_context(user_agent=UA)
              page = ctx.new_page()

              print("=" * 60)
              print("STEP 1: clear challenge on us-24 schedule page")
              ok = clear_until_ready(page, BASE + "/us-24/briefings/schedule/index.html")
              print("CLEARED:", ok)
              if not ok:
                  print("FATAL: could not clear challenge; aborting fetch tests")
                  browser.close()
                  raise SystemExit(0)

              print("waiting 20s before in-page fetches...")
              time.sleep(20)

              print("=" * 60)
              print("STEP 2: in-page same-origin fetches (paced 15s)")

              targets = [
                  ("sessions us-24 microsite", "/us-24/briefings/schedule/sessions.json"),
                  ("sessions usa/2025 newpath", "/archive/usa/2025/briefings/schedule/sessions.json"),
                  ("sessions asia/2024 newpath", "/archive/asia/2024/briefings/schedule/sessions.json"),
                  ("sessions europe/2023 newpath", "/archive/europe/2023/briefings/schedule/sessions.json"),
                  ("legacy static us-16", "/us-16/briefings.html"),
                  ("archives inventory", "/html/archives.html"),
              ]
              results = {}
              for label, path in targets:
                  results[label] = page_fetch(page, label, BASE + path)

              print("=" * 60)
              print("STEP 3: JSON item counts for fetched sessions.json")
              for label in [t[0] for t in targets if "sessions" in t[1]]:
                  r = results.get(label, {})
                  if r.get("status") == 200 and r.get("len", 0) > 1000:
                      try:
                          res2 = page.evaluate(
                              "async (u) => { const r = await fetch(u, {credentials:'include'}); const t = await r.text(); return t; }",
                              BASE + [t[1] for t in targets if t[0] == label][0],
                          )
                          data = json.loads(res2)
                          n = len(data) if isinstance(data, list) else len(data.get("sessions", data))
                          sample = ""
                          if isinstance(data, list) and data:
                              sample = str(data[0])[:150]
                          print(f"  {label}: JSON_OK items={n} sample={sample!r}")
                      except Exception as e:
                          print(f"  {label}: re-fetch/parse error {repr(e)[:150]}")
                      time.sleep(10)

              print("=" * 60)
              print("STEP 4: paced second navigation (asia/2024 page, 30s wait)")
              time.sleep(30)
              try:
                  resp = page.goto(BASE + "/archive/asia/2024/briefings/schedule/index.html",
                                   timeout=60000, wait_until="domcontentloaded")
                  time.sleep(8)
                  print("  NAV2_STATUS:", resp.status if resp else None,
                        "TITLE:", page.title()[:60])
                  li = page.locator("ul#cal_content_Day li").count()
                  print("  NAV2_RENDERED_LI:", li)
              except Exception as e:
                  print("  NAV2 ERROR:", repr(e)[:200])

              browser.close()
          PY
