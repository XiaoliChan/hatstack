name: Egress Probe

# Phase 0, iteration 6 — fresh browser process per event.
# v5 verdict: in-page fetch AND XHR both dead; second nav in same context dead.
# Hypothesis under test: a COMPLETE browser relaunch (new process, new context,
# same runner IP) resets the per-session bot score, so "one browser per event"
# works. Four sequential browsers: 3 JSON-era microsites + 1 legacy static page.

on:
  workflow_dispatch:

jobs:
  fresh-browser-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Fresh-browser-per-event probe
        run: |
          python - <<'PY'
          import json, time
          from playwright.sync_api import sync_playwright

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          BASE = "https://www.blackhat.com"

          EVENTS = [
              ("browser1 us-24",  "/us-24/briefings/schedule/index.html"),
              ("browser2 eu-24",  "/eu-24/briefings/schedule/index.html"),
              ("browser3 asia-24", "/asia-24/briefings/schedule/index.html"),
              ("browser4 us-16 legacy", "/us-16/briefings.html"),
          ]

          def run_one(pw, label, path):
              print("=" * 60)
              print(f"[{label}] launching FRESH browser for {path}")
              browser = pw.chromium.launch(args=["--no-sandbox"])
              ctx = browser.new_context(user_agent=UA)
              page = ctx.new_page()

              captured = []
              def on_response(resp):
                  try:
                      if "sessions.json" in resp.url:
                          captured.append(resp)
                  except Exception:
                      pass
              page.on("response", on_response)

              ok = False
              for i in range(4):
                  try:
                      page.goto(BASE + path, timeout=60000, wait_until="domcontentloaded")
                  except Exception as e:
                      print(f"  goto error: {repr(e)[:120]}")
                  time.sleep(8)
                  t = page.title()
                  print(f"  try {i}: title={t[:60]!r}")
                  low = t.lower()
                  if "moment" not in low and "attention" not in low:
                      ok = True
                      break
                  time.sleep(12)

              print(f"  PASSED_CHALLENGE: {ok}")
              if ok:
                  time.sleep(10)
                  li = page.locator("ul#cal_content_Day li").count()
                  print(f"  RENDERED_LI: {li}")
                  print(f"  OWN_XHR_CAPTURED: {len(captured)}")
                  for r in captured:
                      try:
                          b = r.body()
                          extra = ""
                          try:
                              d = json.loads(b)
                              extra = f" items={len(d) if isinstance(d, list) else -1}"
                          except Exception:
                              pass
                          print(f"    {r.url[-70:]} status={r.status} bytes={len(b)}{extra}")
                      except Exception as e:
                          print("    read err:", repr(e)[:100])
                  if "legacy" in label.lower():
                      links = page.locator("a[href*='.pdf']").count()
                      print(f"  LEGACY_PDF_LINKS_ON_PAGE: {links}")

              browser.close()
              return ok

          with sync_playwright() as pw:
              for label, path in EVENTS:
                  run_one(pw, label, path)
                  print("  sleeping 45s before next browser...")
                  time.sleep(45)
          print("PROBE_COMPLETE")
          PY
